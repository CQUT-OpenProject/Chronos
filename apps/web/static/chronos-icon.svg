<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
	<defs>
		<filter
			id="card-shadow"
			x="-35%"
			y="-25%"
			width="170%"
			height="170%"
			color-interpolation-filters="sRGB"
		>
			<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B1F33" flood-opacity="0.08" />
		</filter>
		<filter
			id="badge-shadow"
			x="-50%"
			y="-50%"
			width="200%"
			height="200%"
			color-interpolation-filters="sRGB"
		>
			<feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0B1F33" flood-opacity="0.08" />
		</filter>
	</defs>

	<rect width="108" height="108" fill="#f0f4f8" />

	<g filter="url(#card-shadow)">
		<path
			fill="#FFFFFF"
			stroke="#D7E2EA"
			stroke-opacity="0.42"
			stroke-width="0.75"
			d="M28,28h52c4.418,0 8,3.582 8,8v40c0,4.418 -3.582,8 -8,8H28c-4.418,0 -8,-3.582 -8,-8V36c0,-4.418 3.582,-8 8,-8z"
		/>
		<path
			fill="#0068B7"
			d="M20,41h68c1.1,0 2,0.9 2,2v4c0,1.1 -0.9,2 -2,2H20c-1.1,0 -2,-0.9 -2,-2v-4c0,-1.1 0.9,-2 2,-2z"
		/>
		<rect x="33.5" y="24" width="9" height="12" rx="2" fill="#0068B7" />
		<rect x="65.5" y="24" width="9" height="12" rx="2" fill="#0068B7" />

		<!-- 3×2 course grid -->
		<rect x="33" y="53" width="6.5" height="6.5" rx="1.5" fill="#0068B7" opacity="0.82" />
		<rect x="42" y="53" width="6.5" height="6.5" rx="1.5" fill="#0068B7" opacity="0.28" />
		<rect x="51" y="53" width="6.5" height="6.5" rx="1.5" fill="#0068B7" opacity="0.82" />
		<rect x="33" y="62" width="6.5" height="6.5" rx="1.5" fill="#0068B7" opacity="0.28" />
		<rect x="42" y="62" width="6.5" height="6.5" rx="1.5" fill="#0068B7" opacity="0.82" />
		<rect x="51" y="62" width="6.5" height="6.5" rx="1.5" fill="#0068B7" opacity="0.55" />
	</g>

	<g filter="url(#badge-shadow)">
		<circle cx="70" cy="68" r="10.5" fill="#FFFFFF" />
		<circle cx="70" cy="68" r="9" fill="#DDBA8F" />
		<path
			fill="#0B1F33"
			d="M70,62.5c0.7,0 1.2,0.6 1.2,1.2v4l3.2,1.8c0.6,0.3 0.7,1 0.4,1.5s-1,0.7 -1.5,0.4l-3.6,-2.1c-0.4,-0.2 -0.6,-0.6 -0.6,-1.1v-4.5c0,-0.7 0.5,-1.2 1.2,-1.2z"
		/>
	</g>
</svg>
