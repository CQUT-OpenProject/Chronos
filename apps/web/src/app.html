<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0068B7" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Chronos" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<script>
			(function () {
				try {
					var mode = localStorage.getItem('chronos_preferences:theme_mode');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = mode === 'dark' || ((mode === 'auto' || !mode) && prefersDark);
					if (dark) {
						document.documentElement.classList.add('dark');
					}
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) {
						// Keep in sync with THEME_COLOR_* in apply-appearance.ts
						meta.setAttribute('content', dark ? '#1a1c1e' : '#0068B7');
					}
					// Immersive status bar under viewport-fit=cover: white icons on dark,
					// system default (dark icons) on light. Android ignores this meta.
					var statusBar = document.querySelector(
						'meta[name="apple-mobile-web-app-status-bar-style"]'
					);
					if (statusBar) {
						statusBar.setAttribute('content', dark ? 'black-translucent' : 'default');
					}
				} catch (e) {}
			})();
		</script>

		<meta name="text-scale" content="scale" />
		<script>
			window.__chronosInstallPrompt = null;
			window.addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
				window.__chronosInstallPrompt = event;
			});

			['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
				document.addEventListener(
					eventName,
					function (event) {
						event.preventDefault();
					},
					{ passive: false }
				);
			});

			(function () {
				var bootFailureShown = false;
				// Splash stays until hide; only upgrade to the error card after a long delay
				// (or on real script-load errors). Slow engine boot must not flash failure.
				var BOOT_FAILURE_MS = 25000;
				var bootFailureTimer = null;

				function clearBootFailureTimer() {
					if (bootFailureTimer != null) {
						clearTimeout(bootFailureTimer);
						bootFailureTimer = null;
					}
				}

				function applyBootFailure() {
					if (bootFailureShown || window.__chronosAppMounted) return;
					bootFailureShown = true;
					clearBootFailureTimer();

					var el = document.getElementById('chronos-boot-fallback');
					var splash = document.getElementById('chronos-boot-splash');
					var failure = document.getElementById('chronos-boot-failure');
					var detail = document.getElementById('chronos-boot-fallback-detail');
					if (!el) return;

					if (detail) {
						detail.textContent = navigator.onLine
							? '应用资源加载失败，请刷新重试。'
							: '当前处于离线状态，无法加载应用资源。请先在线打开一次，或连接网络后重试。';
					}

					if (splash) splash.hidden = true;
					if (failure) failure.hidden = false;
					el.hidden = false;
				}

				function showBootFailure() {
					if (document.getElementById('chronos-boot-fallback')) {
						applyBootFailure();
						return;
					}
					document.addEventListener(
						'DOMContentLoaded',
						function () {
							applyBootFailure();
						},
						{ once: true }
					);
				}

				window.__chronosHideBootFallback = function () {
					window.__chronosAppMounted = true;
					clearBootFailureTimer();
					var el = document.getElementById('chronos-boot-fallback');
					if (el) el.hidden = true;
				};

				window.addEventListener(
					'error',
					function (event) {
						var isScript = event.target && event.target.tagName === 'SCRIPT';
						if (isScript && !window.__chronosAppMounted) {
							showBootFailure();
						}
					},
					true
				);

				bootFailureTimer = setTimeout(function () {
					bootFailureTimer = null;
					if (!window.__chronosAppMounted) {
						showBootFailure();
					}
				}, BOOT_FAILURE_MS);
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="chronos-boot-fallback">
			<div id="chronos-boot-splash" class="chronos-boot-splash" aria-hidden="true">
				<img
					src="%sveltekit.assets%/chronos-icon.svg"
					alt=""
					width="72"
					height="72"
					decoding="async"
				/>
			</div>
			<div id="chronos-boot-failure" class="chronos-boot-fallback-card" hidden>
				<p class="chronos-boot-fallback-title">无法加载 Chronos</p>
				<p id="chronos-boot-fallback-detail" class="chronos-boot-fallback-detail">
					应用资源加载失败，请刷新重试。
				</p>
				<button type="button" class="chronos-boot-fallback-button" onclick="location.reload()">
					重试
				</button>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<style>
			#chronos-boot-fallback {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				padding-top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
				background: #f0f4f8;
				color: #0f172a;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
			}

			html.dark #chronos-boot-fallback {
				background: #121316;
				color: #e2e5ef;
			}

			#chronos-boot-fallback[hidden] {
				display: none !important;
			}

			.chronos-boot-splash {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.chronos-boot-splash[hidden] {
				display: none !important;
			}

			.chronos-boot-splash img {
				display: block;
				width: 72px;
				height: 72px;
			}

			.chronos-boot-fallback-card {
				max-width: 20rem;
				text-align: center;
			}

			.chronos-boot-fallback-card[hidden] {
				display: none !important;
			}

			.chronos-boot-fallback-title {
				margin: 0 0 0.5rem;
				font-size: 1.125rem;
				font-weight: 700;
			}

			.chronos-boot-fallback-detail {
				margin: 0 0 1rem;
				font-size: 0.875rem;
				line-height: 1.5;
				color: #475569;
			}

			html.dark .chronos-boot-fallback-detail {
				color: #a7abb4;
			}

			.chronos-boot-fallback-button {
				border: none;
				border-radius: 9999px;
				background: #0068b7;
				color: #fff;
				font-size: 0.875rem;
				font-weight: 600;
				padding: 0.625rem 1.5rem;
				cursor: pointer;
			}
		</style>
	</body>
</html>
