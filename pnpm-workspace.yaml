  - '@pnpm/exe.linux-arm64@12.4.2'
  - '@pnpm/exe.linux-arm64-musl@12.4.2'
  - '@pnpm/exe.linux-ppc64@12.4.2'
  - '@pnpm/exe.linux-riscv64@12.4.2'
  - '@pnpm/exe.linux-s390x@12.4.2'
  - '@pnpm/exe.linux-x64@12.4.2'
  - '@pnpm/exe.linux-x64-musl@12.4.2'
